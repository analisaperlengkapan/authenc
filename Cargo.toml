[package]
name = "authenc"
version = "0.1.0"
edition = "2021"
description = "Authentication and authorization service"
resolver = "2"  # Use the new feature resolver

[lib]
path = "src/lib.rs"

[[bin]]
name = "authenc"
path = "src/main.rs"

[features]
# Framework features
default = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "flate2",
    "totp-rs",
    "rdkafka",
    "reqwest"
]
axum = ["dep:axum", "dep:tower", "dep:tower-http"]

# Authentication features
auth = ["dep:jsonwebtoken", "dep:argon2"]
oidc = ["dep:url"] # RSA removed - using Ed25519 for OIDC JWT signing

# Database features
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]

# Monitoring features
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Development features (enables all features)
dev = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "reqwest",
    "rdkafka",
    "totp-rs",
    "flate2"
]

# RBAC feature
rbac = []
flate2 = ["dep:flate2"]

[dependencies]
# Core
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "full"] }
http = "1.0"
http-body = "1.0"
temp-env = "0.2"

# Web Frameworks and HTTP
axum = { version = "0.7", features = ["http1", "http2", "json", "macros"], optional = true }
tower = { version = "0.4", features = ["util", "timeout", "load-shed", "limit"], optional = true }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br", "fs", "add-extension"], optional = true }
hyper = { version = "1.0", features = ["full"] }

# Authentication and Security
jsonwebtoken = { version = "9.0", features = ["use_pem"], optional = true }
argon2 = { version = "0.5", optional = true }
bcrypt = "0.15"
# rsa = { version = "0.9", features = ["pem"], optional = true } # REMOVED: Vulnerable to timing attacks (RUSTSEC-2023-0071)

# Database
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3", "with-chrono-0_4"], optional = true }
deadpool-postgres = { version = "0.10", optional = true }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Async Runtime & Middleware
futures = { version = "0.3", features = ["std"] }
futures-util = { version = "0.3", features = ["std"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
pin-project = "1.0"

# Logging and Tracing
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
log = "0.4"
env_logger = "0.10"

# Authentication & Security
rand = "0.8"
getrandom = "0.2"
aes-gcm = "0.10"
base64ct = "1.8"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
x509-parser = "0.15"
sha2 = "0.10"
hex = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "5.5", features = ["raw-api"] }
once_cell = "1.21"
num_cpus = "1.16"
serde_qs = "0.11"
url = { version = "2.0", optional = true }
urlencoding = "2.1"

# Messaging
rdkafka = { version = "0.38", features = ["tokio"], optional = true }

# TOTP
totp-rs = { version = "5.7", default-features = false, optional = true }
totp-lite = { version = "2.0", optional = true }

# HTTP Client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }

# LDAP
ldap3 = "0.11"

# Security
rustls = { version = "0.23" }
rustls-pemfile = "2.0"
rustls-native-certs = "0.7"
webpki-roots = "0.26"
ring = "0.17"
flate2 = { version = "1.0", features = ["zlib"], optional = true }
regex = "1.0"

# Metrics
metrics = { version = "0.21", optional = true }
metrics-exporter-prometheus = { version = "0.12", default-features = false, features = ["http-listener"], optional = true }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
http-body-util = "0.1.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "2.0"
