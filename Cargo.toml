[workspace]
resolver = "3"
members = ["crates/contract", "crates/identity", "crates/web", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/analisaperlengkapan/authenc"
authors = ["Authenc contributors"]

# ---------------------------------------------------------------------------
# Lints — declared once, inherited by every crate via `[lints] workspace = true`
# ---------------------------------------------------------------------------
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# `unwrap` and `panic` in a request path take down a request (or, historically
# here, the whole process). Make them a conscious, annotated decision.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Internal
authenc-contract = { path = "crates/contract" }
authenc-identity = { path = "crates/identity" }
authenc-web = { path = "crates/web" }

# Leptos
leptos = "0.8.20"
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
leptos_axum = "0.8.10"

# Web / async
axum = "0.8.9"
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = "0.7.0"
http = "1.5"

# Persistence
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "json",
  "macros",
  "migrate",
] }

# Serialisation & data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }

# Errors
thiserror = "2.0.19"
async-trait = "0.1.91"
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
  "pool",
] }
anyhow = "1.0.104"

# Config
figment = { version = "0.10.19", features = ["toml", "env"] }
clap = { version = "4.6", features = ["derive", "env"] }
secrecy = { version = "0.10.3", features = ["serde"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Wasm
wasm-bindgen = "0.2.126"
console_error_panic_hook = "0.1.7"

# Dev / test
axum-test = "21.0.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Deliberately NOT `panic = "abort"`: with abort, a panic in one request kills
# the whole process. We unwind and catch per-request (CatchPanicLayer).
panic = "unwind"

# cargo-leptos builds the wasm bundle with this profile; optimise for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# ---------------------------------------------------------------------------
# cargo-leptos
# ---------------------------------------------------------------------------
[[workspace.metadata.leptos]]
name = "authenc"
bin-package = "authenc-server"
# The binary is named `authenc`, not `authenc-server`; without this
# cargo-leptos looks for target/debug/authenc-server and fails.
bin-exe-name = "authenc"
lib-package = "authenc-web"

site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "crates/web/public"

tailwind-input-file = "crates/web/style/main.css"

site-addr = "127.0.0.1:3000"
reload-port = 3001

browserquery = "defaults"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
