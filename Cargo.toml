[workspace]
members = [
    "crates/authenc-core",
    "crates/authenc-crypto",
    "crates/authenc-models",
    "crates/authenc-services",
    "crates/authenc-spi",
    "crates/authenc-database",
    "crates/authenc-vault",
    "crates/ui"
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Authenc Team"]
license = "Apache-2.0"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.42.0", features = ["full"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
axum = { version = "0.8.1", features = ["macros"] }
tower = { version = "0.5.1", features = ["full"] }
tower-http = { version = "0.6.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
async-trait = "0.1.83"
anyhow = "1.0.94"
thiserror = "2.0.6"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
futures = "0.3.31"
once_cell = "1.20.2"

# Cryptography
ring = "0.17.8"
rand = "0.10"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
argon2 = { version = "0.5.3", features = ["std", "rand"] }
bcrypt = "0.19.1"
hmac = "0.12.1"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4.3"
base32 = "0.5.1"
p256 = { version = "0.14-rc.1", features = ["ecdsa", "pem", "jwk"] }
signature = "3.0"

# Networking
reqwest = { version = "0.13.3", features = ["json", "multipart", "rustls", "form"] }

# Database
tokio-postgres = { version = "0.7.17", features = ["with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }

# Leptos (Frontend)
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = { version = "0.8.13" }
gloo-net = "0.7.0"
wasm-bindgen = "0.2.100"

# Internal crates
authenc-core = { path = "crates/authenc-core" }
authenc-crypto = { path = "crates/authenc-crypto" }
authenc-models = { path = "crates/authenc-models" }
authenc-services = { path = "crates/authenc-services" }
authenc-spi = { path = "crates/authenc-spi" }
authenc-database = { path = "crates/authenc-database" }
authenc-vault = { path = "crates/authenc-vault" }
