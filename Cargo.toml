[workspace]
resolver = "2"
members = [
    ".",
    "crates/authenc-core",
    "crates/authenc-models",
    "crates/authenc-crypto",
    "crates/authenc-database",
    "crates/authenc-vault",
    "crates/authenc-spi",
    "crates/authenc-services",
    "crates/ui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
authors = ["Authenc Team <security@authenc.dev>"]
license = "Apache-2.0"
description = "Enterprise-grade Identity and Access Management (IAM) service"
repository = "https://github.com/authenc/authenc"
homepage = "https://authenc.dev"
documentation = "https://docs.authenc.dev"
keywords = ["iam", "authentication", "authorization", "security", "rust"]
categories = ["authentication", "cryptography", "web-programming"]

[workspace.dependencies]
# Internal crates
authenc-core = { path = "crates/authenc-core", features = ["axum-support"] }
authenc-models = { path = "crates/authenc-models" }
authenc-crypto = { path = "crates/authenc-crypto" }
authenc-database = { path = "crates/authenc-database", features = ["test-support"] }
authenc-vault = { path = "crates/authenc-vault" }
authenc-spi = { path = "crates/authenc-spi" }
authenc-services = { path = "crates/authenc-services", features = ["rdkafka"] }

# Core async runtime
anyhow = "1.0.100"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "full"] }
futures = "0.3.31"
futures-util = "0.3.31"
tokio-util = { version = "0.7.13", features = ["full"] }
async-trait = "0.1.85"
pin-project = "1.1.8"

# HTTP and web frameworks
http = "1.2.0"
http-body = "1.0.1"
http-body-util = "0.1.2"

# Web Frameworks and HTTP
axum = { version = "0.8.1", features = ["http1", "http2", "json", "macros"] }
axum-extra = { version = "0.10.0", features = ["cookie"] }
tower = { version = "0.5.2", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "compression-br", "add-extension", "fs"] }
hyper = { version = "1.5.1", features = ["full"] }
reqwest = { version = "0.12.12", features = ["json"] }

# Authentication and Security
jsonwebtoken = { version = "10.0", default-features = false, features = ["aws_lc_rs"] }
argon2 = { version = "0.5", features = ["std", "rand"] }
bcrypt = "0.17.1"

# Database
tokio-postgres = { version = "0.7.14", features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
redis = { version = "0.24", features = ["tokio-comp"] }
deadpool-redis = "0.14"

# Serialization & Data
uuid = { version = "1.11.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.17"
once_cell = "1.20.2"

# Logging and Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.27.0"
opentelemetry-otlp = "0.27.0"
log = "0.4.27"
env_logger = "0.11.7"

# Cryptography
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"
aes-gcm = "0.11.0-rc.2"
base64 = "0.22"
base64ct = "1.8"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
p384 = { version = "0.13.0", features = ["ecdsa"] }
p521 = { version = "0.13.3", features = ["ecdsa"] }
ecdsa = "0.16.9"
ed448-goldilocks = "0.9.0"
x509-parser = "0.15"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"

# Time & Concurrency
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["raw-api"] }
num_cpus = "1.16"
serde_qs = "0.15.0"
url = "2.0"
urlencoding = "2.1"

# Messaging
rdkafka = { version = "0.38", features = ["tokio"] }

# TOTP
totp-rs = { version = "5.7", default-features = false }
base32 = "0.4"

# LDAP
ldap3 = "0.12.1"

# SAML XML Processing
quick-xml = { version = "0.31", features = ["serialize"] }
flate2 = { version = "1.0", features = ["zlib"] }

# Kubernetes Operator
kube = { version = "0.87", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }
schemars = "0.8"
tokio-stream = "0.1"

# TLS & Security
rustls = "0.23"
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
ring = "0.17"
regex = "1.0"

# OpenSSL
openssl = "0.10"

# Hardware Security Module
tss-esapi = { version = "7.4" }

# Post-Quantum Cryptography
pqcrypto-mldsa = { version = "0.1.2" }
pqcrypto-mlkem = { version = "0.1.1" }
pqcrypto-falcon = { version = "0.4.1" }
pqcrypto-traits = "0.3.5"

# WebAuthn
webauthn-rs = "0.5"

# Shamir Secret Sharing
curve25519-dalek = "4.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bincode = "1.3"
hkdf = "0.12"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.12", default-features = false, features = ["http-listener"] }

# i18n
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

# Testing
axum-test = "18.1"
temp-env = "0.3.6"
serial_test = "3.2"

[package]
name = "authenc"
version.workspace = true
edition.workspace = true
description.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "authenc"
path = "src/main.rs"

[features]
# Framework features
default = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "flate2",
    "totp-rs",
    "rdkafka",
    "reqwest", "test"
]
axum = ["dep:axum", "dep:tower", "dep:tower-http"]

# Authentication features
auth = ["dep:jsonwebtoken", "dep:argon2"]
oidc = ["dep:url"]

# Database features
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]
redis-store = ["dep:redis", "dep:deadpool-redis"]

# Monitoring features
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Hardware Security features
tpm = ["dep:tss-esapi"]

# Development features
dev = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "reqwest",
    "rdkafka",
    "totp-rs",
    "flate2",
    "quantum"
]

# RBAC feature
rbac = []
flate2 = ["dep:flate2"]
reqwest = ["dep:reqwest"]
test = ["reqwest"]

# Quantum-resistant cryptography features
quantum = ["dep:pqcrypto-mldsa", "dep:pqcrypto-mlkem", "dep:pqcrypto-falcon"]

[dependencies]
# Internal crates
authenc-core = { workspace = true }
authenc-models = { workspace = true }
authenc-crypto = { workspace = true }
authenc-database = { workspace = true }
authenc-vault = { workspace = true }
authenc-spi = { workspace = true }
authenc-services = { workspace = true }

# Core async runtime
anyhow = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
pin-project = { workspace = true }

# HTTP
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
temp-env = { workspace = true }

# Web Frameworks
axum = { workspace = true, optional = true }
axum-extra = { workspace = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true }
reqwest = { workspace = true, optional = true }

# Authentication and Security
jsonwebtoken = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
bcrypt = { workspace = true }

# Database
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }

# Serialization & Data
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }

# Logging and Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# Cryptography
rand = { workspace = true }
rand_chacha = { workspace = true }
getrandom = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
base64ct = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ecdsa = { workspace = true }
ed448-goldilocks = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Time & Concurrency
chrono = { workspace = true }
dashmap = { workspace = true }
num_cpus = { workspace = true }
serde_qs = { workspace = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true }

# Messaging
rdkafka = { workspace = true, optional = true }

# TOTP
totp-rs = { workspace = true, optional = true }
base32 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }

# LDAP
ldap3 = { workspace = true }

# SAML XML Processing
quick-xml = { workspace = true }
flate2 = { workspace = true, optional = true }

# Kubernetes
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
tokio-stream = { workspace = true }

# TLS & Security
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
ring = { workspace = true }
regex = { workspace = true }

# OpenSSL
openssl = { workspace = true }

# Hardware Security Module
tss-esapi = { workspace = true, optional = true }

# Post-Quantum Cryptography
pqcrypto-mldsa = { workspace = true, optional = true }
pqcrypto-mlkem = { workspace = true, optional = true }
pqcrypto-falcon = { workspace = true, optional = true }
pqcrypto-traits = { workspace = true }

# WebAuthn
webauthn-rs = { workspace = true }

# Shamir Secret Sharing
curve25519-dalek = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
bincode = { workspace = true }
hkdf = { workspace = true }

# Metrics
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
axum-test = { workspace = true }

[dev-dependencies]
p256 = { version = "0.13.2", features = ["ecdsa-core"] }
tempfile = "3"
tokio-test = "0.4"
serial_test = { workspace = true }
lazy_static = "1.5"
temp-env = { workspace = true }
webauthn-rs = { workspace = true }

# Performance optimization profiles
[profile.dev]
opt-level = 1
debug = true
incremental = true
codegen-units = 256
lto = false
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tokio]
opt-level = 3

[profile.dev.package.axum]
opt-level = 3
