[package]
name = "authenc"
version = "0.1.0"
edition = "2024"
description = "Authentication and authorization service"
resolver = "2"  # Use the new feature resolver

[lib]
path = "src/lib.rs"

[[bin]]
name = "authenc"
path = "src/main.rs"

[features]
# Framework features
default = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "flate2",
    "totp-rs",
    "rdkafka",
    "dep:reqwest", "test"
]
axum = ["dep:axum", "dep:tower", "dep:tower-http"]

# Authentication features
auth = ["dep:jsonwebtoken", "dep:argon2"]
oidc = ["dep:url"] # Using Ed25519 for OIDC JWT signing (RSA removed due to RUSTSEC-2023-0071)

# Database features
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]

# Monitoring features
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Hardware Security features
tpm = ["dep:tss-esapi"]

# Development features (enables all features)
dev = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "dep:reqwest",
    "rdkafka",
    "totp-rs",
    "flate2",
    "admin_console",
    "quantum"
]

# RBAC feature
rbac = []
flate2 = ["dep:flate2"]
test = ["dep:reqwest"]
admin_console = []

# Quantum-resistant cryptography features
quantum = ["dep:pqcrypto-mldsa", "dep:pqcrypto-mlkem", "dep:pqcrypto-falcon"]

[dependencies]
# Core
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "full"] }
http = "1.0"
http-body = "1.0"
temp-env = "0.2"

# Web Frameworks and HTTP
axum = { version = "0.8", features = ["http1", "http2", "json", "macros"], optional = true }
tower = { version = "0.5", features = ["util", "timeout", "load-shed", "limit"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "fs", "add-extension"], optional = true }
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"], default-features = false, optional = true }

# Authentication and Security
jsonwebtoken = { version = "9.3", features = ["use_pem"], optional = true }
argon2 = { version = "0.5", optional = true }
bcrypt = "0.17"
# RSA REMOVED: Vulnerable to timing attacks (RUSTSEC-2023-0071) - replaced with Ed25519

# Database
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3", "with-chrono-0_4", "with-serde_json-1"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }

# Serialization & Data
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
once_cell = "1.21"

# Async Runtime & Middleware
futures = { version = "0.3", features = ["std"] }
futures-util = { version = "0.3", features = ["std"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
pin-project = "1.0"

# Logging and Tracing
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
log = "0.4"  # Required for compatibility with external crates

# Cryptography
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"  # v0.3 has breaking API changes
aes-gcm = "0.10"
base64 = "0.22"
base64ct = "1.8"  # Constant-time base64 for security-critical operations
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "jwk"] }
p521 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
ed448-goldilocks = "0.9.0"
x509-parser = "0.15"
sha2 = "0.10"
hex = "0.4"

# Time & Concurrency
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["raw-api"] }
num_cpus = "1.16"
serde_qs = "0.15.0"
url = { version = "2.0", optional = true }
urlencoding = "2.1"

# Messaging
rdkafka = { version = "0.38", features = ["tokio"], optional = true }

# TOTP (Time-based One-Time Password)
totp-rs = { version = "5.7", default-features = false, optional = true }
base32 = "0.4"  # v0.5 has breaking API changes (RFC4648 renamed)
hmac = "0.12"
sha1 = "0.10"

# LDAP
ldap3 = "0.12.1"

# SAML XML Processing
quick-xml = { version = "0.31", features = ["serialize"] }

# Kubernetes Operator
kube = { version = "0.87", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }
schemars = "0.8"  # v1.0 has breaking API changes
tokio-stream = "0.1"

# TLS & Security (Pure Rust)
rustls = { version = "0.23" }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
ring = "0.17"
flate2 = { version = "1.0", features = ["zlib"], optional = true }
regex = "1.0"

# OpenSSL (Only for PKCS12 and advanced X.509 operations)
openssl = "0.10"

# Hardware Security Module
tss-esapi = { version = "7.4", optional = true }

# Post-Quantum Cryptography
pqcrypto-mldsa = { version = "0.1.2", optional = true }
pqcrypto-mlkem = { version = "0.1.1", optional = true }
pqcrypto-falcon = { version = "0.4.1", optional = true }
pqcrypto-traits = "0.3.5"

# Shamir Secret Sharing dependencies
curve25519-dalek = "4.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bincode = "1.3"  # v2.0 has completely different API
hkdf = "0.12"

# Metrics
metrics = { version = "0.21", optional = true }
metrics-exporter-prometheus = { version = "0.12", default-features = false, features = ["http-listener"], optional = true }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
http-body-util = "0.1.3"
axum-test = "18.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "3.2"
# sqlx removed - using tokio-postgres + deadpool-postgres for better compile speed and flexibility

# Performance optimizations
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Fast compile for development
[profile.dev.package."*"]
opt-level = 2
