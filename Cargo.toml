[workspace]
resolver = "2"
members = ["."]

[workspace.package]
name = "authenc"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
authors = ["SIMPelv2 Team <security@kejaksaan.go.id>"]
license = "Apache-2.0"
description = "Enterprise-grade Identity and Access Management (IAM) service for SIMPelv2"
repository = "https://github.com/analisaperlengkapan/simpel2"
homepage = "https://simpel.kejaksaan.go.id"
documentation = "https://docs.simpel.kejaksaan.go.id/authenc"
keywords = ["iam", "authentication", "authorization", "security", "rust"]
categories = ["authentication", "cryptography", "web-programming"]

[package]
name = "authenc"
version.workspace = true
edition.workspace = true
description.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "authenc"
path = "src/main.rs"

[features]
# Framework features
default = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "flate2",
    "totp-rs",
    "rdkafka",
    "dep:reqwest", "test"
]
axum = ["dep:axum", "dep:tower", "dep:tower-http"]

# Authentication features
auth = ["dep:jsonwebtoken", "dep:argon2"]
oidc = ["dep:url"] # Using Ed25519 for OIDC JWT signing (RSA removed due to RUSTSEC-2023-0071)

# Database features
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]

# Monitoring features
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Hardware Security features
tpm = ["dep:tss-esapi"]

# Development features (enables all features)
dev = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "dep:reqwest",
    "rdkafka",
    "totp-rs",
    "flate2",
    "admin_console",
    "quantum"
]

# RBAC feature
rbac = []
flate2 = ["dep:flate2"]
test = ["dep:reqwest"]
admin_console = []

# Quantum-resistant cryptography features
quantum = ["dep:pqcrypto-mldsa", "dep:pqcrypto-mlkem", "dep:pqcrypto-falcon"]

[dependencies]
# Core async runtime
anyhow = "1.0.100"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "full"] }
futures = "0.3.31"
futures-util = "0.3.31"
tokio-util = { version = "0.7.13", features = ["full"] }
async-trait = "0.1.85"
pin-project = "1.1.8"

# HTTP and web frameworks
http = "1.2.0"
http-body = "1.0.1"
http-body-util = "0.1.2"
temp-env = "0.3.6"

# Web Frameworks and HTTP
axum = { version = "0.8.6", optional = true, features = ["http1", "http2", "json", "macros"] }
tower = { version = "0.5.2", optional = true, features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.6.2", optional = true, features = ["cors", "trace", "compression-br", "fs", "add-extension"] }
hyper = { version = "1.5.1", features = ["full"] }
reqwest = { version = "0.12.12", optional = true, features = ["json", "blocking"] }

# Authentication and Security
jsonwebtoken = { version = "10.0", optional = true, default-features = false, features = ["aws_lc_rs"] }
argon2 = { version = "0.5", optional = true, features = ["std", "rand"] }
bcrypt = "0.17.1"
# RSA REMOVED: Vulnerable to timing attacks (RUSTSEC-2023-0071) - replaced with Ed25519

# Database
tokio-postgres = { version = "0.7.14", optional = true, features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14.1", optional = true, features = ["serde"] }

# Serialization & Data
uuid = { version = "1.11.1", features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.17"
once_cell = "1.20.2"

# Additional utilities (moved from above)

# Logging and Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.27.0"
opentelemetry-otlp = "0.27.0"
log = "0.4.27"
env_logger = "0.11.7"

# Cryptography
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"  # v0.3 has breaking API changes
aes-gcm = "0.10"
base64 = "0.22"
base64ct = "1.8"  # Constant-time base64 for security-critical operations
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "jwk"] }
p521 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
ed448-goldilocks = "0.9.0"
x509-parser = "0.15"
sha2 = "0.10"
hex = "0.4"

# Time & Concurrency
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["raw-api"] }
num_cpus = "1.16"
serde_qs = "0.15.0"
url = { version = "2.0", optional = true }
urlencoding = "2.1"

# Messaging
rdkafka = { version = "0.38", features = ["tokio"], optional = true }

# TOTP (Time-based One-Time Password)
totp-rs = { version = "5.7", default-features = false, optional = true }
base32 = "0.4"  # v0.5 has breaking API changes (RFC4648 renamed)
hmac = "0.12"
sha1 = "0.10"

# LDAP
ldap3 = "0.12.1"

# SAML XML Processing
quick-xml = { version = "0.31", features = ["serialize"] }

# Kubernetes Operator
kube = { version = "0.87", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }
schemars = "0.8"  # v1.0 has breaking API changes
tokio-stream = "0.1"

# TLS & Security (Pure Rust)
rustls = { version = "0.23" }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
ring = "0.17"
flate2 = { version = "1.0", features = ["zlib"], optional = true }
regex = "1.0"

# OpenSSL (Only for PKCS12 and advanced X.509 operations)
openssl = "0.10"

# Hardware Security Module
tss-esapi = { version = "7.4", optional = true }

# Post-Quantum Cryptography
pqcrypto-mldsa = { version = "0.1.2", optional = true }
pqcrypto-mlkem = { version = "0.1.1", optional = true }
pqcrypto-falcon = { version = "0.4.1", optional = true }
pqcrypto-traits = "0.3.5"

# Shamir Secret Sharing dependencies
curve25519-dalek = "4.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bincode = "1.3"  # v2.0 has completely different API
hkdf = "0.12"

# Metrics
metrics = { version = "0.21", optional = true }
metrics-exporter-prometheus = { version = "0.12", default-features = false, features = ["http-listener"], optional = true }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
axum-test = "18.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "3.2"
lazy_static = "1.5"
# sqlx removed - using tokio-postgres + deadpool-postgres for better compile speed and flexibility

# Performance optimizations
# Performance optimization profiles
[profile.dev]
# Faster compile times for development
opt-level = 1                # Light optimization for better dev experience
debug = true                 # Keep debug info for development
incremental = true           # Enable incremental compilation
codegen-units = 256          # Parallel compilation for faster builds
lto = false                  # Disable LTO in dev for faster incremental builds
split-debuginfo = "unpacked" # Faster debug builds on Linux/macOS

[profile.release]
# Maximum optimization for production
opt-level = 3                # Maximum optimization level
lto = "fat"                  # Full LTO for maximum optimization
codegen-units = 1            # Single codegen unit for best optimization
panic = "abort"              # Smaller binary, faster panics
strip = true                 # Strip symbols for smaller binary
overflow-checks = false      # Disable overflow checks for performance
debug = false                # No debug info in release
incremental = false          # Disable incremental for clean release builds

# Optimize dependencies in dev mode for faster runtime
[profile.dev.package."*"]
opt-level = 2           # Optimize dependencies while keeping fast compile times

# Optimize specific heavy dependencies
[profile.dev.package.tokio]
opt-level = 3           # Tokio benefits from optimization

[profile.dev.package.axum]
opt-level = 3           # Axum benefits from optimization
