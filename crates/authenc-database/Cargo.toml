[package]
name = "authenc-database"
version.workspace = true
edition.workspace = true
description = "Database persistence layer for Authenc IAM"
license.workspace = true
repository.workspace = true

[features]
default = ["db"]
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]
redis-store = ["dep:redis", "dep:deadpool-redis"]
test-support = []

[dependencies]
authenc-core = { workspace = true }
authenc-models = { workspace = true }
authenc-crypto = { workspace = true }
authenc-spi = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }

tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
