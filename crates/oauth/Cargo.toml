[package]
name = "authenc-oauth"
description = "OAuth 2.0 and OpenID Connect provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
authenc-contract = { workspace = true }
authenc-identity = { workspace = true }

sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
async-trait = { workspace = true }

# Talking to a social-login provider. Behind the `Transport` trait, so the
# protocol rules are testable without a network — which is the whole reason
# that trait exists, since no provider's credentials can run in CI.
reqwest = { workspace = true }
url = "2.5"

# Signing and JOSE. The JWT encoding is 40 lines in `token.rs` rather than a
# library, because the one decision that matters — never reading `alg` from the
# header — is a property of the call site, not of the encoder. `jsonwebtoken`
# was declared here and never used; it pulled in aws-lc-rs, a C and assembly
# crypto stack, for nothing.
ed25519-dalek = { version = "3.0", features = ["pkcs8", "rand_core"] }
aes-gcm = "0.11"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4.3"
argon2 = { version = "0.5.3", features = ["std"] }
subtle = "2.6.1"

# NOTE: never add `axum` or `leptos` here. The protocol logic must be testable
# without an HTTP stack; the endpoints live in `authenc-server`.

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
