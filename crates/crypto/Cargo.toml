[package]
name = "authenc-crypto"
version.workspace = true
edition.workspace = true
description = "Cryptographic operations for Authenc IAM"
license.workspace = true
repository.workspace = true

[features]
default = []
quantum = ["dep:pqcrypto-mldsa", "dep:pqcrypto-mlkem", "dep:pqcrypto-falcon"]

[dependencies]
authenc-core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Data types
chrono = { workspace = true }
uuid = { workspace = true }

# Cryptography - symmetric
aes-gcm = { workspace = true }

# Cryptography - signatures
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ecdsa = { workspace = true }
ed448-goldilocks = { workspace = true }

# Cryptography - hashing & encoding
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
base64ct = { workspace = true }

# Cryptography - misc
rand = { workspace = true }
rand_chacha = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
hkdf = { workspace = true }

# Shamir Secret Sharing
curve25519-dalek = { workspace = true }
bincode = { workspace = true }

# TLS & X.509
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
openssl = { workspace = true }
x509-parser = { workspace = true }

# XML signatures
quick-xml = { workspace = true }

# JWT
jsonwebtoken = { workspace = true }

# Password hashing
argon2 = { workspace = true }

# Error handling & misc
thiserror = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }

# Web framework (for mTLS middleware)
axum = { workspace = true }
http = { workspace = true }

# Post-Quantum Cryptography
pqcrypto-mldsa = { workspace = true, optional = true }
pqcrypto-mlkem = { workspace = true, optional = true }
pqcrypto-falcon = { workspace = true, optional = true }
pqcrypto-traits = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
