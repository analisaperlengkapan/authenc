[package]
name = "authenc-server"
version.workspace = true
edition.workspace = true
description = "Authenc Server application"
license.workspace = true
repository.workspace = true

[dependencies]
authenc-core = { path = "../core", version = "0.4.0" }
authenc-api = { path = "../api", version = "0.4.0", features = ["axum"] }
authenc-db = { path = "../db", version = "0.4.0" }
authenc-services = { path = "../services", version = "0.4.0" }
authenc-crypto = { path = "../crypto", version = "0.4.0" }

# Async & Runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Web Framework
axum = { workspace = true, features = ["http1", "http2", "json", "macros"] }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
headers = "0.4"

# Logging & Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config & Utils
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# None for now
