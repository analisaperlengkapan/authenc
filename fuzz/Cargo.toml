[package]
name = "authenc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.authenc]
path = ".."

[dependencies.serde_json]
version = "1.0"

[dependencies.quick-xml]
version = "0.31"
features = ["serialize"]

[dependencies.url]
version = "2.0"

[dependencies.base64ct]
version = "1.8"

[dependencies.regex]
version = "1.0"

[dependencies.uuid]
version = "1.0"

[dependencies.p256]
version = "0.13"
features = ["ecdsa"]

