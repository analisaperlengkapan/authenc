apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authencs.authenc.io
spec:
  group: authenc.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
                maximum: 10
              version:
                type: string
              database:
                type: object
                properties:
                  host:
                    type: string
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  database:
                    type: string
                  usernameSecret:
                    type: string
                  passwordSecret:
                    type: string
                  sslMode:
                    type: string
                    enum: ["disable", "require", "verify-ca", "verify-full"]
                required:
                - host
                - port
                - database
                - usernameSecret
                - passwordSecret
              tls:
                type: object
                properties:
                  enabled:
                    type: boolean
                  secretName:
                    type: string
                  certManagerIssuer:
                    type: string
              features:
                type: object
                properties:
                  oidc:
                    type: boolean
                  saml:
                    type: boolean
                  oid4vc:
                    type: boolean
                  webauthn:
                    type: boolean
                  socialLogin:
                    type: boolean
                  deviceManagement:
                    type: boolean
                  zeroTrust:
                    type: boolean
              resources:
                type: object
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    required:
                    - cpu
                    - memory
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    required:
                    - cpu
                    - memory
                required:
                - requests
                - limits
              ingress:
                type: object
                properties:
                  enabled:
                    type: boolean
                  className:
                    type: string
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        host:
                          type: string
                        paths:
                          type: array
                          items:
                            type: object
                            properties:
                              path:
                                type: string
                              pathType:
                                type: string
                                enum: ["Exact", "Prefix", "ImplementationSpecific"]
                            required:
                            - path
                            - pathType
                      required:
                      - host
                      - paths
                  tls:
                    type: array
                    items:
                      type: object
                      properties:
                        secretName:
                          type: string
                        hosts:
                          type: array
                          items:
                            type: string
                      required:
                      - secretName
                      - hosts
              monitoring:
                type: object
                properties:
                  enabled:
                    type: boolean
                  prometheus:
                    type: object
                    properties:
                      scrapeInterval:
                        type: string
                      metricsPath:
                        type: string
                  grafana:
                    type: object
                    properties:
                      dashboardUid:
                        type: string
            required:
            - version
            - database
            - features
            - resources
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Running", "Failed", "Unknown"]
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              endpoint:
                type: string
              version:
                type: string
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: authencs
    singular: authenc
    kind: Authenc
    shortNames:
    - auth
