# Default values for Authenc Helm chart

# Number of replicas
replicaCount: 1

# Authenc image configuration
image:
  repository: authenc/authenc
  tag: "latest"
  pullPolicy: IfNotPresent

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 65534

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: authenc.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Database configuration
database:
  host: ""
  port: 5432
  name: authenc
  username: ""
  password: ""
  sslMode: require

# TLS configuration
tls:
  enabled: true
  secretName: ""
  certManager:
    issuer: ""

# Resource limits and requests
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Authenc features
features:
  oidc: true
  saml: true
  oid4vc: true
  webauthn: true
  socialLogin: true
  deviceManagement: true
  zeroTrust: true

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 30s
    metricsPath: /metrics
  grafana:
    enabled: false
    dashboardUid: ""

# Logging configuration
logging:
  level: info
  format: json

# Environment variables
extraEnvVars: []

# ConfigMaps
extraConfigMaps: []

# Secrets
extraSecrets: []

# Volumes
extraVolumes: []

# Volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecarContainers: []

# Lifecycle hooks
lifecycle: {}

# Probes
probes:
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policies
networkPolicy:
  enabled: false
  allowExternal: true

# RBAC configuration
rbac:
  create: true
  clusterRole: true

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Persistence configuration
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 8Gi
  storageClass: ""
  annotations: {}

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: "30d"
  image:
    repository: authenc/backup
    tag: "latest"

# Custom configuration
config: {}

# Custom secrets
secrets: {}
