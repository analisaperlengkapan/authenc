apiVersion: authenc.io/v1
kind: Authenc
metadata:
  name: authenc-sample
  namespace: default
spec:
  replicas: 2
  version: "latest"
  database:
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    database: "authenc"
    usernameSecret: "authenc-db-secret"
    passwordSecret: "authenc-db-secret"
    sslMode: "require"
  tls:
    enabled: true
    certManagerIssuer: "letsencrypt-prod"
  features:
    oidc: true
    saml: true
    oid4vc: true
    webauthn: true
    socialLogin: true
    deviceManagement: true
    zeroTrust: true
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
    - host: "auth.example.com"
      paths:
      - path: "/"
        pathType: "Prefix"
    tls:
    - secretName: "authenc-tls"
      hosts:
      - "auth.example.com"
  monitoring:
    enabled: true
    prometheus:
      scrapeInterval: "30s"
      metricsPath: "/metrics"
    grafana:
      dashboardUid: "authenc-dashboard"
