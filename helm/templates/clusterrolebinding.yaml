apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "authenc.fullname" . }}-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "authenc.fullname" . }}-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ include "authenc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
