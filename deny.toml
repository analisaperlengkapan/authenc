# cargo-deny policy.
#
# This is run by `.github/workflows/security.yml` on every pull request and
# weekly. The previous `deny.toml` was never invoked by any workflow, so its
# advisory ignores went stale unnoticed — it still suppressed an RSA advisory
# for a dependency the project had already removed.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# No ignores. If one becomes necessary, it must carry the advisory id, the
# reason, and the date it should be revisited — an ignore without an expiry is
# how the previous file rotted.
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # Unmaintained; anything reaching for it should use `time` or `jiff`.
    { crate = "chrono", reason = "use `time`, which this workspace already depends on" },
    # Pulls a second async runtime alongside tokio.
    { crate = "async-std", reason = "this workspace is tokio-only" },
    # A pre-release in a security-relevant dependency is not acceptable here;
    # the previous tree pinned `aes-gcm = 0.11.0-rc.2` in production.
    { crate = "openssl", reason = "use rustls; openssl needs a system library and widens the attack surface" },
]

skip-tree = [
    # The Leptos and wasm-bindgen ecosystems move together and legitimately
    # carry duplicate transitive versions mid-release-cycle.
    { crate = "leptos", depth = 4 },
    { crate = "wasm-bindgen", depth = 3 },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
