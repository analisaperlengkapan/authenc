# cargo-deny policy.
#
# This is run by `.github/workflows/security.yml` on every pull request and
# weekly. The previous `deny.toml` was never invoked by any workflow, so its
# advisory ignores went stale unnoticed — it still suppressed an RSA advisory
# for a dependency the project had already removed.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Every ignore carries the advisory id, why it is tolerable, and when to look
# again. An ignore without those three is how the previous file rotted — it
# still suppressed an RSA advisory for a dependency already removed.
ignore = [
    # Unmaintained, not vulnerable. A proc-macro helper reached through
    # `leptos -> either_of`. It runs at build time and contributes no code to
    # the binary. Revisit 2027-02, or whenever Leptos drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro reached through leptos; unmaintained, no advisory" },
    # Same shape: `leptos_macro`'s error-reporting helper, build-time only.
    # Revisit 2027-02.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: build-time proc-macro reached through leptos_macro" },
]

[licenses]
version = 2
# Permissive licences only, and only ones actually encountered — an allowance
# nothing uses is policy that has stopped being checked. cargo-deny reports an
# unused entry, so this list stays honest by construction.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # The Mozilla CA bundle in `webpki-roots` is data, not code, and ships
    # under a data licence rather than a software one.
    "CDLA-Permissive-2.0",
    # `webauthn-rs` and its supporting crates. File-level copyleft: changes to
    # those files must be published, which linking against them does not
    # trigger. Nothing in this workspace modifies them.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path, which Cargo records
# as `*`. That is not the unpinned-registry-dependency this check exists to
# catch.
allow-wildcard-paths = true

deny = [
    # Anything reaching for it should use `time`, which this workspace already
    # depends on. `expect-json` is the assertion library inside `axum-test`, a
    # dev-dependency: it never reaches a shipped binary, and we do not choose
    # its dependencies.
    { crate = "chrono", reason = "use `time`, which this workspace already depends on", wrappers = ["expect-json"] },
    # Pulls a second async runtime alongside tokio.
    { crate = "async-std", reason = "this workspace is tokio-only" },
    # A pre-release in a security-relevant dependency is not acceptable here;
    # the previous tree pinned `aes-gcm = 0.11.0-rc.2` in production.
    #
    # The ban stands for everything this workspace chooses: TLS is rustls
    # everywhere. `webauthn-rs-core` is the one exception, and it is a real
    # cost rather than a technicality — a C library in the build and in the
    # runtime image, plus its share of the distribution's CVE traffic.
    #
    # It is admitted anyway because the alternative is worse. Verifying a
    # WebAuthn assertion means COSE keys, X.509 chains, and signatures under
    # several algorithms; the previous tree wrote that by hand and its
    # verifier returned `Ok(true)` without reading its argument. A pre-release
    # was the other option: webauthn-rs 0.6 drops openssl for pure Rust, but
    # only exists as `0.6.1-dev`, and a pre-release deciding whether someone is
    # who they claim to be is not a trade this file is willing to make either.
    #
    # Revisit when webauthn-rs 0.6 is released: at that point this wrapper
    # comes out and the ban becomes absolute again.
    { crate = "openssl", reason = "use rustls; openssl needs a system library and widens the attack surface", wrappers = [
      "webauthn-rs-core",
      "webauthn-attestation-ca",
    ] },
    { crate = "openssl-sys", reason = "see `openssl` above", wrappers = [
      "openssl",
      "webauthn-rs-core",
      "webauthn-attestation-ca",
    ] },
]

skip-tree = [
    # The Leptos and wasm-bindgen ecosystems move together and legitimately
    # carry duplicate transitive versions mid-release-cycle.
    { crate = "leptos", depth = 4 },
    { crate = "wasm-bindgen", depth = 3 },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
